# MCP 工具目录（中文场景优先） / MCP Server Registry (China-focused)
#
# 收录标准 / Inclusion criteria:
# - 每条都经过人工核实：仓库或官网真实存在，url 可打开，不收录无法验证的项目。
# - 优先收录官方（official）MCP Server；社区（community）项目需有可运行的公开仓库。
# - 未找到真实 MCP Server 的类别（例如：企业微信专用 Server、政务查询）不收录，
#   不写占位条目。缺口见 registry/README.md。
# - 每条的 language 取自对应仓库的 GitHub 语言统计；auth 为接入该 Server 所需的凭证类型。
# - 最后核实日期 / Last verified: 2026-11-27。
#
# 字段说明：
# - name: 目录内的唯一标识（小写短横线）
# - description / description_en: 中文 / 英文一句话说明
# - category: maps | office | logistics | finance | travel | knowledge | filesystem | web | memory | devtools
# - url: 仓库或官网地址（必须真实可打开）
# - language: 主要实现语言
# - auth: none | api_key | oauth | token（接入时需要的凭证）
# - status: official（官方发布）| community（社区维护）

- name: amap-maps
  description: "高德地图 MCP Server：地理编码、逆编码、POI 搜索、路线规划、天气。官方另有托管端点 https://mcp.amap.com/mcp（需高德 Web 服务 Key）。"
  description_en: "Amap (Gaode Maps) MCP Server: geocoding, reverse geocoding, POI search, route planning, weather. An official hosted endpoint is also available at https://mcp.amap.com/mcp (Amap Web Service key required)."
  category: maps
  url: https://github.com/sugarforever/amap-mcp-server
  language: Python
  auth: api_key
  status: community

- name: lark-openapi-mcp
  description: "飞书 / Lark 官方 OpenAPI MCP：消息、群组、文档、日历、多维表格等几乎全部开放接口。"
  description_en: "Official Feishu / Lark OpenAPI MCP: messages, groups, docs, calendar, Bitable and nearly all other Open Platform APIs."
  category: office
  url: https://github.com/larksuite/lark-openapi-mcp
  language: TypeScript
  auth: oauth
  status: official

