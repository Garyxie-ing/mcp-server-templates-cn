  description_en: "OFD e-invoice reader with an MCP server: extract text and invoice fields (number, date, buyer, seller, amounts) from Chinese OFD files. Runs locally, no API key needed."
  category: finance
  url: https://github.com/Edgar-311/ofdkit
  language: Python
  auth: none
  status: community

